<header class="page-header">
  <h1 class="app-title">{{ appTitle }}</h1>
  <hr/>
  <div class="center">
    <div>{{ pageTitle }}</div>
  </div>
  <div class="split">
    <div
      class="indicator"
      *ngFor="let indicator of indicators; trackBy: trackByLabel"
    >
      <p class="label">{{ indicator.label }}</p>
      <p class="value">{{ indicator.value }}</p>
    </div>
  </div>
</header>
